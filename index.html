<title>Neuroregulations-Typ Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --aubergine: #5D4552;
    --cream: #FFF6EE;
    --sage-light: #BFC4BB;
    --mauve: #9D9196;
    --sage-deep: #6E7D6E;
    --gold: #C9A876;

    --bg: var(--cream);
    --surface: #FFFCF7;
    --border: #E7DFD3;
    --border-selected: var(--aubergine);
    --fg: var(--aubergine);
    --muted: var(--mauve);
    --shadow: 0 1px 2px rgba(93, 69, 82, 0.06), 0 10px 28px rgba(93, 69, 82, 0.08);
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    color: var(--fg);
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 24px 96px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .top-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { width: 42px; height: 42px; object-fit: contain; flex-shrink: 0; border-radius: 50%; }
  .kicker {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--sage-deep);
  }
  .eyebrow {
    font-size: 0.85rem;
    color: var(--muted);
  }
  h1 {
    font-family: "Plus Jakarta Sans", sans-serif;
    font-weight: 800;
    font-size: 2rem;
    line-height: 1.2;
    margin: 0;
    text-wrap: balance;
    color: var(--aubergine);
  }
  .script-accent {
    font-family: "Dancing Script", cursive;
    font-weight: 700;
    font-size: 1.3em;
    color: var(--gold);
  }
  .subtitle {
    color: var(--muted);
    margin: 0;
    max-width: 58ch;
    font-size: 1.02rem;
    line-height: 1.55;
  }

  .card {
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
    box-shadow: var(--shadow);
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.82rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .progress-track {
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--sage-deep), var(--gold));
    transition: width 0.35s ease;
  }

  fieldset {
    border: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  legend {
    padding: 0;
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1.4;
    text-wrap: balance;
    color: var(--aubergine);
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 15px 18px;
    background: var(--bg);
    cursor: pointer;
    line-height: 1.5;
    font-size: 0.97rem;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option:hover { border-color: var(--sage-deep); background: #FFFEFC; }
  .option.selected {
    border-color: var(--border-selected);
    background: #FFFEFC;
  }
  .option input {
    margin-top: 2px;
    accent-color: var(--aubergine);
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  button {
    font-family: inherit;
    font: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 13px 26px;
    border-radius: 10px;
    border: 1.5px solid var(--aubergine);
    background: var(--aubergine);
    color: var(--cream);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button:hover:not(:disabled) { box-shadow: 0 4px 14px rgba(93, 69, 82, 0.25); transform: translateY(-1px); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button:focus-visible, .option input:focus-visible, .link-button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }
  button.secondary {
    background: transparent;
    color: var(--aubergine);
    border: 1.5px solid var(--border);
  }
  button.secondary:hover:not(:disabled) { border-color: var(--aubergine); box-shadow: none; transform: none; }
  .link-button {
    background: none;
    border: none;
    padding: 0;
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .link-button:hover { color: var(--sage-deep); }

  .arrow-icon { flex-shrink: 0; }

  .section { display: flex; flex-direction: column; gap: 12px; }
  .section-label {
    font-size: 0.74rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--sage-deep);
  }

  ul.plain { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  ul.plain li {
    border-left: 2.5px solid var(--gold);
    padding: 2px 0 2px 16px;
    font-size: 0.97rem;
  }

  ol.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 16px; counter-reset: step; }
  ol.steps li {
    counter-increment: step;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    font-size: 0.97rem;
    line-height: 1.55;
  }
  ol.steps li::before {
    content: counter(step);
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    color: var(--aubergine);
    font-weight: 700;
    font-size: 0.82rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }

  .secondary-note {
    font-size: 0.92rem;
    color: var(--fg);
    background: var(--cream);
    border: 1px dashed var(--sage-light);
    border-radius: 10px;
    padding: 14px 18px;
    margin: 0;
  }
  .disclaimer {
    font-size: 0.8rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 20px;
    margin-top: 4px;
    line-height: 1.5;

    const sorted = Object.entries(counts).sort(function (a, b) { return b[1] - a[1]; });

    const secondaryScore = sorted[1][1];

    return { primaryType: primaryType, secondaryType: showSecondary ? secondaryType : null };

  function IntroScreen(props) {
    return h(
      "div",
      { className: "app" },
      h(Kicker),
      h("div", { className: "eyebrow" }, "Selbsttest · 8 Fragen · ca. 3 Minuten"),
      h("h1", null, h("span", { className: "script-accent" }, "Dein"), " Neuroregulations-Typ"),
      h(
        "p",
        { className: "subtitle" },
        "8 kurze Fragen zu Deinen typischen Stressreaktionen und Körperempfindungen. Am Ende erhältst Du Deinen persönlichen Neuro-Typ mit konkreten, sofort umsetzbaren Empfehlungen."
      ),
      h(
        "div",
        { className: "card" },
        h(
          "p",
          { style: { margin: 0 } },
          "Beantworte jede Frage so, wie es sich für Dich im Alltag am ehesten stimmig anfühlt. Es gibt keine richtigen oder falschen Antworten — nur Deine tatsächliche Reaktion zählt."
        ),
        h("div", null, h("button", { onClick: props.onStart }, "Quiz starten", h(ArrowIcon)))
      )
    );
  }

  function QuestionScreen(props) {
    const q = props.question;
    const pct = Math.round(((props.step + 1) / props.total) * 100);
    return h(
      "div",
      { className: "app" },
      h(Kicker),
      h(
        "div",
        { className: "progress-row" },
        h("span", null, "Frage " + (props.step + 1) + " von " + props.total),
        h("span", null, pct + " %")
      ),
      h("div", { className: "progress-track" }, h("div", { className: "progress-fill", style: { width: pct + "%" } })),
      h(
        "div",
        { className: "card" },
        h(
          "fieldset",
          null,
          h("legend", null, q.text),
          h(
            "div",
            { className: "options" },
            q.options.map(function (opt) {
              return h(
                "label",
                {
                  className: "option" + (props.selected === opt.type ? " selected" : ""),
                  key: opt.type
                },
                h("input", {
                  type: "radio",
                  name: "q" + props.step,
                  checked: props.selected === opt.type,
                  onChange: function () { props.onSelect(opt.type); }
                }),
                h("span", null, opt.label)
              );
            })
          )
        ),
        h(
          "div",
          { className: "nav-row" },
          props.step > 0
            ? h("button", { className: "link-button", onClick: props.onBack }, "← Zurück")
            : h("span", null),
          h(
            "button",
            { onClick: props.onNext, disabled: !props.selected },
            props.step + 1 === props.total ? "Ergebnis anzeigen" : "Weiter",
            h(ArrowIcon)
          )
        )
      )
    );
  }

  function ResultScreen(props) {
    const primary = TYPES[props.result.primaryType];
    const secondary = props.result.secondaryType ? TYPES[props.result.secondaryType] : null;
    return h(
      "div",
      { className: "app" },
      h(Kicker),
      h("div", { className: "eyebrow" }, "Dein Ergebnis"),
      h("h1", null, primary.name),
      h("p", { className: "subtitle" }, primary.subtitle),
      h(
        "div",
        { className: "card" },
        h("p", { style: { margin: 0 } }, primary.description),
        secondary
          ? h(
              "p",
              { className: "secondary-note" },
              "Zusätzlich zeigen sich bei Dir deutliche Anteile des " +
                secondary.name +
                " — Nervensystem-Muster überschneiden sich häufig, besonders in unterschiedlichen Lebensbereichen."
            )
          : null,
        h(
          "div",
          { className: "section" },
          h("div", { className: "section-label" }, "Typische körperliche Signale"),
          h(
            "ul",
            { className: "plain" },
            primary.signals.map(function (s, i) { return h("li", { key: i }, s); })
          )
        ),
        h(
          "div",
          { className: "section" },
          h("div", { className: "section-label" }, "Deine nächsten Schritte"),
          h(
            "ol",
            { className: "steps" },
            primary.recommendations.map(function (r, i) { return h("li", { key: i }, r); })
          )
        )
      ),
      h("div", null, h("button", { className: "secondary", onClick: props.onReset }, "Quiz noch einmal starten")),
      h(
        "p",
        { className: "disclaimer" },
        "Dieses Quiz bietet eine erste Orientierung zu typischen Stressreaktionsmustern des Nervensystems. Es ersetzt keine Diagnostik, Therapie oder individuelle Beratung."
      )
    );
  }

  function App() {
    const screenState = useState("intro");
    const screen = screenState[0], setScreen = screenState[1];
    const stepState = useState(0);
    const step = stepState[0], setStep = stepState[1];
    const answersState = useState(new Array(QUESTIONS.length).fill(null));
    const answers = answersState[0], setAnswers = answersState[1];
    const selectedState = useState(null);
    const selected = selectedState[0], setSelected = selectedState[1];

    function startQuiz() {
      setAnswers(new Array(QUESTIONS.length).fill(null));
      setStep(0);
      setSelected(null);
      setScreen("quiz");
    }

    function goNext() {
      const next = answers.slice();
      next[step] = selected;
      setAnswers(next);
      if (step + 1 < QUESTIONS.length) {
        setStep(step + 1);
        setSelected(next[step + 1]);
      } else {
        setScreen("result");
      }
    }

    function goBack() {
      const prevStep = step - 1;
      setStep(prevStep);
      setSelected(answers[prevStep]);
    }

    if (screen === "intro") {
      return h(IntroScreen, { onStart: startQuiz });
    }
    if (screen === "quiz") {
      return h(QuestionScreen, {
        question: QUESTIONS[step],
        step: step,
        total: QUESTIONS.length,
        selected: selected,
        onSelect: setSelected,
        onNext: goNext,
        onBack: goBack
      });
    }
    const result = computeResult(answers);
    return h(ResultScreen, { result: result, onReset: startQuiz });
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
